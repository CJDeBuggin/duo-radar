<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b0b12">
<title>Duo Radar</title>
<style>
:root{--bg:#07070c;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.10);--txt:#f5f5f7;--dim:#9a9aa6;--green:#30d158;--red:#ff453a;--amber:#ffd60a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--txt);background:var(--bg);min-height:100vh;overflow-x:hidden}
.glow{position:fixed;inset:-20vh -20vw auto;height:80vh;background:radial-gradient(closest-side,rgba(120,140,255,.28),transparent),radial-gradient(closest-side at 80% 30%,rgba(255,255,255,.12),transparent);filter:blur(40px);z-index:-1;animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(6vw,4vh) scale(1.1)}}
.wrap{max-width:560px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 20px 40px}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}
.live{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(48,209,88,.7);animation:ping 1.8s infinite}
.live.bad{background:var(--amber);animation:none}
@keyframes ping{70%{box-shadow:0 0 0 10px rgba(48,209,88,0)}100%{box-shadow:0 0 0 0 rgba(48,209,88,0)}}
h1{font-size:38px;font-weight:700;letter-spacing:-.02em;margin:10px 0 4px;background:linear-gradient(180deg,#fff,#c9c9d6);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:16px;display:flex;align-items:center;gap:10px}
.swatch{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e9e7e1 60%,#cfccc4);border:1px solid rgba(255,255,255,.4)}
.hero{margin:26px 0 18px;padding:26px 22px;border-radius:26px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(20px);text-align:center;transition:all .4s}
.hero.in{background:linear-gradient(160deg,rgba(48,209,88,.28),rgba(48,209,88,.06));border-color:rgba(48,209,88,.6);box-shadow:0 0 60px rgba(48,209,88,.25)}
.big{font-size:30px;font-weight:700;letter-spacing:-.01em}
.hero p{color:var(--dim);margin-top:6px;font-size:15px}
.btn{display:inline-block;margin-top:18px;padding:14px 26px;border-radius:999px;background:#fff;color:#000;font-weight:600;text-decoration:none;font-size:16px}
.hero.in .btn{background:var(--green);color:#00210b;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.stores{display:grid;gap:12px}
.store{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.store b{display:block;font-size:17px;font-weight:600}.store span{color:var(--dim);font-size:13px}
.pill{font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;background:rgba(255,69,58,.14);color:#ff7a72;white-space:nowrap}
.pill.in{background:rgba(48,209,88,.18);color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--dim)}
h2{font-size:15px;color:var(--dim);font-weight:600;margin:26px 4px 10px;text-transform:uppercase;letter-spacing:.1em}
.hist{border-radius:20px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.ev{display:flex;justify-content:space-between;gap:10px;padding:14px 18px;border-top:1px solid var(--line);font-size:15px}.ev:first-child{border-top:0}
.ev small{color:var(--dim)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:var(--red)}.dot.in{background:var(--green)}
.empty{padding:18px;color:var(--dim);font-size:15px;text-align:center}
.warn{margin-top:12px;padding:12px 16px;border-radius:14px;background:rgba(255,214,10,.12);color:var(--amber);font-size:14px;display:none}
.grid{border-radius:20px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.row{display:grid;grid-template-columns:1fr 84px 84px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);font-size:15px}.row:first-child{border-top:0}
.row.head{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;padding:10px 18px}
.row.me{background:rgba(255,255,255,.05)}.row .c{text-align:center}
.mdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:rgba(255,69,58,.55)}.mdot.in{background:var(--green);box-shadow:0 0 10px rgba(48,209,88,.7)}
.tag{font-size:11px;color:#000;background:#fff;border-radius:6px;padding:2px 6px;margin-left:6px;font-weight:600}
.cw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:-1px;border:1px solid rgba(255,255,255,.35)}
footer{margin-top:28px;text-align:center;color:var(--dim);font-size:12px}
</style></head><body><div class="glow"></div><div class="wrap">
<div class="eyebrow"><i class="live" id="live"></i><span id="liveTxt">Live</span></div>
<h1>Duo Radar</h1>
<div class="sub"><i class="swatch"></i>iPhone Duo · 256GB · Star White</div>
<div class="hero" id="hero"><div class="big" id="big">Watching…</div><p id="heroP">Checking Apple pickup stock</p>
<a class="btn" id="buy" href="https://www.apple.com/shop/buy-iphone/iphone-duo/7.6-inch-display-256gb-star-white" target="_blank">Open on Apple</a></div>
<div class="warn" id="warn"></div>
<div class="stores" id="stores"></div>
<div class="stats"><div class="stat"><b id="ago">–</b><span>last update</span></div><div class="stat"><b id="checks">–</b><span>checks</span></div><div class="stat"><b id="up">–</b><span>running</span></div></div>
<h2>All models at both stores</h2><div class="grid" id="grid"></div>
<h2>Restock history · all models</h2><div class="hist" id="hist"></div>
<footer>Checks Apple about every 20 seconds · alerts go to ntfy</footer></div>
<script>
let S=null;
const ago=t=>{const s=Math.max(0,(Date.now()-new Date(t))/1000|0);return s<60?s+"s":s<3600?(s/60|0)+"m":(s/3600|0)+"h "+((s%3600)/60|0)+"m"};
const fmt=t=>new Date(t).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
function render(){if(!S)return;const any=S.stores.filter(x=>x.available);
 const hero=document.getElementById("hero");hero.classList.toggle("in",any.length>0);
 document.getElementById("big").textContent=any.length?"In stock now!":"Not in stock yet";
 document.getElementById("heroP").textContent=any.length?"Available at "+any.map(x=>x.name.replace("Apple ","")).join(" & ")+". Go!":"You'll get a push the second it drops";
 document.getElementById("buy").textContent=any.length?"Buy now on Apple":"Open on Apple";
 document.getElementById("stores").innerHTML=S.stores.map(x=>`<div class="store"><div><b>${x.name.replace("Apple ","")}</b><span>In-store pickup</span></div><div class="pill ${x.available?"in":""}">${x.available?"Available":"Unavailable"}</div></div>`).join("");
 const stale=!S.last_ok||(Date.now()-new Date(S.last_ok))>900000;
 document.getElementById("live").classList.toggle("bad",!S.ok||stale);
 document.getElementById("liveTxt").textContent=(!S.ok||stale)?"Reconnecting":"Live";
 const w=document.getElementById("warn");w.style.display=(!S.ok||stale)?"block":"none";w.textContent=stale?"No update from the checker in 15+ minutes. It may be restarting.":(S.error||"");
 document.getElementById("ago").textContent=S.last_ok?ago(S.last_ok):"–";
 document.getElementById("checks").textContent=S.checks.toLocaleString();
 document.getElementById("up").textContent=ago(S.started);
 const sw=m=>`<i class="cw" style="background:${/Night/.test(m)?"#1c1f2b":"#ecebe6"}"></i>`;
 const ms=S.models||[];
 document.getElementById("grid").innerHTML=`<div class="row head"><div>Model</div><div class="c">Galleria</div><div class="c">West Cty</div></div>`+ms.map(x=>`<div class="row ${x.m=="256GB Star White"?"me":""}"><div>${sw(x.m)}${x.m}${x.m=="256GB Star White"?'<span class="tag">Yours</span>':""}</div>${x.a.map(a=>`<div class="c"><i class="mdot ${a?"in":""}"></i></div>`).join("")}</div>`).join("");
 const h=[...S.history].reverse();
 document.getElementById("hist").innerHTML=h.length?h.map(e=>`<div class="ev"><div><i class="dot ${e.kind=="in"?"in":""}"></i><b>${e.model||"256GB Star White"}</b> ${e.kind=="in"?"in stock":"sold out"} · ${e.store.replace("Apple ","").replace("Saint Louis ","")}</div><small>${fmt(e.t)}</small></div>`).join(""):`<div class="empty">No restocks spotted yet for any model. Fingers crossed 🤞</div>`;}
async function load(){try{const r=await fetch("https://ntfy.sh/duo-status-7f3d73a348ae/json?poll=1&since=13h");const lines=(await r.text()).trim().split("\n").filter(Boolean);for(let i=lines.length-1;i>=0;i--){const m=JSON.parse(lines[i]);if(m.event=="message"){S=JSON.parse(m.message);break}}render()}catch(e){}}
load();setInterval(load,30000);setInterval(render,1000);
</script></body></html>
